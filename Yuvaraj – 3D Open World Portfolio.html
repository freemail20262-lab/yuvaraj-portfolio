<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
:root{--bg:#07070c;--fg:#f3efe9;--mut:#b9b2ad;--red:#ff2a3c;--card:rgba(10,8,14,.72);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:Rajdhani,Arial,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;display:block}
#hud{position:fixed;inset:0;pointer-events:none}

#title h1{font-size:clamp(56px,13vw,160px);margin:0;letter-spacing:.06em;font-weight:700;text-shadow:0 0 40px rgba(255,42,60,.6);font-style:italic}
#title p{letter-spacing:.5em;color:var(--mut);margin:6px 0 24px;font-size:clamp(12px,2vw,18px)}
.btn{pointer-events:auto;cursor:pointer;background:rgba(255,42,60,.12);color:var(--fg);border:2px solid var(--red);padding:14px 34px;font:700 18px Rajdhani,sans-serif;letter-spacing:.15em;box-shadow:0 0 22px rgba(255,42,60,.5)}

#panel{position:absolute;left:4vw;bottom:calc(90px + env(safe-area-inset-bottom,0px));max-width:min(460px,88vw);background:var(--card);border-left:3px solid var(--red);padding:18px 22px;backdrop-filter:blur(8px);opacity:0;transform:translateY(16px);transition:.7s}
#panel.on{opacity:1;transform:none}

#panel h2{margin:4px 0 8px;font-size:28px;letter-spacing:.05em}

#nav{position:absolute;right:2vw;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px;opacity:0;transition:opacity 1s}

#bar{position:absolute;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:10px;opacity:0;transition:opacity 1s}
#sig{position:absolute;right:3vw;bottom:calc(80px + env(safe-area-inset-bottom,0px));font:44px 'Pinyon Script',cursive;opacity:0;transition:1s;color:#ffe9d6}
@media(max-width:700px){#nav{top:auto;bottom:70px;right:0;left:0;transform:none;flex-direction:row;overflow-x:auto;padding:0 8px}#nav button{white-space:nowrap}#panel{bottom:calc(120px + env(safe-area-inset-bottom,0px))}}
</style></head><body>
<div id="hud">
 <div id="title"><h1>YUVARAJ</h1><p>THE OPEN WORLD PORTFOLIO</p><button class="btn" id="enter">ENTER MY WORLD →</button></div>
 <div id="panel"></div><div id="sig">Yuvaraj</div>
 <div id="nav"></div>

</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const T=THREE,R=Math.random;
const scene=new T.Scene();scene.fog=new T.FogExp2(0x3a1a38,0.0032);
const cam=new T.PerspectiveCamera(60,innerWidth/innerHeight,.5,2000);
const ren=new T.WebGLRenderer({antialias:true});ren.setPixelRatio(Math.min(devicePixelRatio,2));ren.setSize(innerWidth,innerHeight);
ren.toneMapping=T.ACESFilmicToneMapping;ren.toneMappingExposure=1.15;document.body.prepend(ren.domElement);
// sky
scene.add(new T.Mesh(new T.SphereGeometry(1200,32,16),new T.ShaderMaterial({side:T.BackSide,fog:false,depthWrite:false,
 vertexShader:'varying vec3 p;void main(){p=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
 fragmentShader:'varying vec3 p;void main(){float h=clamp(p.y,0.,1.);vec3 a=vec3(1.,.42,.2),b=vec3(.48,.15,.42),c=vec3(.03,.04,.15);vec3 col=mix(a,b,smoothstep(0.,.25,h));col=mix(col,c,smoothstep(.2,.7,h));gl_FragColor=vec4(col,1.);}'})));
const sun=new T.Mesh(new T.CircleGeometry(60,32),new T.MeshBasicMaterial({color:0xffb070,fog:false}));sun.position.set(-200,70,-900);sun.lookAt(0,0,0);scene.add(sun);
scene.add(new T.HemisphereLight(0xff8a5a,0x20103a,.55));
const dl=new T.DirectionalLight(0xff9a60,.9);dl.position.set(-200,60,-300);scene.add(dl);
// ground & roads
const g=new T.Mesh(new T.PlaneGeometry(1600,1600),new T.MeshStandardMaterial({color:0x0b0b12,roughness:.35,metalness:.4}));g.rotation.x=-Math.PI/2;scene.add(g);
const road=new T.MeshBasicMaterial({color:0xffc890,fog:true});
for(let k=-5;k<=5;k++){const c=k*24+12;
 let a=new T.Mesh(new T.PlaneGeometry(.4,300),road);a.rotation.x=-Math.PI/2;a.position.set(c,.05,0);scene.add(a);
 a=new T.Mesh(new T.PlaneGeometry(300,.4),road);a.rotation.x=-Math.PI/2;a.position.set(0,.05,c);scene.add(a);}
// window texture
const wc=document.createElement('canvas');wc.width=64;wc.height=128;const x=wc.getContext('2d');x.fillStyle='#000';x.fillRect(0,0,64,128);
for(let i=0;i<8;i++)for(let j=0;j<16;j++)if(R()<.45){x.fillStyle=['#ffd9a0','#ffb060','#9fd4ff','#ff7ab0'][R()*4|0];x.fillRect(i*8+1,j*8+2,5,4);}
const wt=new T.CanvasTexture(wc);wt.wrapS=wt.wrapT=T.RepeatWrapping;
function bld(px,pz,w,h,d,col){const geo=new T.BoxGeometry(w,h,d);const uv=geo.attributes.uv;for(let i=0;i<uv.count;i++)uv.setXY(i,uv.getX(i)*w/7,uv.getY(i)*h/14);
 const m=new T.Mesh(geo,new T.MeshStandardMaterial({color:col||0x15151f,emissive:0xffffff,emissiveMap:wt,emissiveIntensity:1.1,roughness:.5,metalness:.5}));m.position.set(px,h/2,pz);scene.add(m);return m;}
const L={tower:[24,-48],college:[-48,-48],studio:[0,24],roof:[-72,72]};
const skip=Object.values(L).map(p=>p.join());
for(let i=-5;i<=5;i++)for(let j=-5;j<=5;j++){const px=i*24,pz=j*24;if(skip.includes([px,pz].join()))continue;const d=Math.hypot(px,pz)/24;
 bld(px+(R()-.5)*3,pz+(R()-.5)*3,10+R()*6,8+R()*(55-d*3)*R()+R()*20,10+R()*6);}
// label sprite
function label(t,s,w,h){const c=document.createElement('canvas');c.width=1024;c.height=Math.round(1024*h/w);const q=c.getContext('2d');q.fillStyle='rgba(8,0,6,.85)';q.fillRect(0,0,c.width,c.height);
 q.strokeStyle='#ff2a3c';q.lineWidth=10;q.shadowColor='#ff2a3c';q.shadowBlur=30;q.strokeRect(10,10,c.width-20,c.height-20);q.fillStyle='#ffe9e9';q.textAlign='center';
 q.font='700 '+c.height*.38+'px Rajdhani,Arial';q.fillText(t,c.width/2,c.height*.58);q.font='600 '+c.height*.15+'px Rajdhani,Arial';q.fillStyle='#ff8a95';q.fillText(s,c.width/2,c.height*.84);
 const m=new T.Mesh(new T.PlaneGeometry(w,h),new T.MeshBasicMaterial({map:new T.CanvasTexture(c),fog:false}));return m;}
// landmarks
const tw=bld(24,-48,18,100,18,0x1c1424);const s1=label('NEARLEARN','SEO • DESIGN • MARKETING',16,5);s1.position.set(24,88,-38.9);scene.add(s1);
const s1b=s1.clone();s1b.position.set(14.9,88,-48);s1b.rotation.y=-Math.PI/2;scene.add(s1b);
bld(-48,-48,26,22,16,0x2a1820);const s2=label('SURANA COLLEGE','B.COM • GRAPHIC INTERNSHIP',20,4.5);s2.position.set(-48,26,-39.9);scene.add(s2);
bld(0,24,30,12,18,0x120a14);const s3=label('CREATIVE STUDIO','IDEAS • DESIGNS • BRANDS',24,6);s3.position.set(0,9,14.9);scene.add(s3);
const gl=new T.PointLight(0xff2a3c,2,70);gl.position.set(0,6,22);scene.add(gl);
for(let i=0;i<5;i++){const sc=label(['GRAPHIC DESIGN','SOCIAL MEDIA','SEO & MARKETING','BRANDING','CONTENT'][i],'',7,3.2);sc.position.set(-12+i*6,3,14.8);scene.add(sc);}
bld(-72,72,22,30,22,0x1a1a24);
// figure on rooftop
const fig=new T.Group(),dk=new T.MeshStandardMaterial({color:0x08080c,roughness:.8});
const body=new T.Mesh(new T.CylinderGeometry(.5,.7,1.7,12),dk);body.position.y=.85;const head=new T.Mesh(new T.SphereGeometry(.38,16,12),dk);head.position.y=1.95;
const hood=new T.Mesh(new T.SphereGeometry(.44,16,12,0,Math.PI*2,0,Math.PI/1.7),dk);hood.position.y=2.02;
const em=new T.Mesh(new T.CircleGeometry(.25,16),new T.MeshBasicMaterial({color:0xff2a3c}));em.position.set(0,1.2,-.62);em.rotation.y=Math.PI;
fig.add(body,head,hood,em);fig.position.set(-72,30,64);scene.add(fig);
// traffic
const traffic=[];for(let i=0;i<46;i++){const ax=i%2,lane=((R()*10|0)-5)*24+12+(R()<.5?-2.2:2.2),dir=R()<.5?1:-1,col=dir>0?0xff2030:0xfff0c8;
 const m=new T.Mesh(new T.BoxGeometry(1.8,1.2,4),new T.MeshBasicMaterial({color:col}));m.position.y=.7;scene.add(m);traffic.push({m,ax,lane,dir,s:(R()-.5)*300,v:10+R()*14});}
// hero car
const car=new T.Group();const cb=new T.Mesh(new T.BoxGeometry(2.2,.9,5),new T.MeshStandardMaterial({color:0x140508,metalness:.9,roughness:.2}));cb.position.y=.7;
const ct=new T.Mesh(new T.BoxGeometry(1.8,.6,2.4),new T.MeshStandardMaterial({color:0x050507,metalness:.9,roughness:.1}));ct.position.set(0,1.3,.3);
const tl=new T.Mesh(new T.BoxGeometry(2,.15,.1),new T.MeshBasicMaterial({color:0xff1a2a}));tl.position.set(0,.95,2.5);car.add(cb,ct,tl);
const cl=new T.PointLight(0xff1a2a,1.4,18);cl.position.set(0,1,3.5);car.add(cl);car.rotation.y=Math.PI;scene.add(car);let carZ=-100;
// stops
const P=(a)=>new T.Vector3(...a);
const stops=[
{id:'Opening',p:[-72,33.6,74],t:[0,24,-80],h:'',b:'',op:1},
{id:'About Me',p:[-68,32.4,60],t:[-72,31.4,64],k:'ABOUT ME',h:'Yuvaraj K',b:'<p>Digital creator • SEO &amp; Marketing • Graphic Designer.</p><p>Digital marketing and creative design professional with experience in SEO, graphic design, social media management and content creation, focused on improving online visibility and creating engaging digital content.</p><p><em>“Turning Ideas Into Visual Experiences”</em></p>'},
{id:'Skills',p:[70,75,60],t:[0,20,-10],k:'SKILLS',h:'What I do',b:'<p><b>Digital Marketing &amp; SEO</b></p><span class=tag>Keyword research</span><span class=tag>On-page SEO</span><span class=tag>Meta titles</span><span class=tag>Backlink research</span><span class=tag>Strategy</span><p><b>Graphic Design</b></p><span class=tag>Posters</span><span class=tag>Social creatives</span><span class=tag>Brochures</span><span class=tag>Branding</span><p><b>Social Media &amp; Content</b></p><span class=tag>Content planning</span><span class=tag>Blog writing</span><span class=tag>Captions</span><span class=tag>Promo copy</span><p><b>Tools:</b> Adobe Photoshop · Canva · MS Word · Tally</p>'},
{id:'NearLearn Tower',p:[58,52,-14],t:[24,58,-48],k:'WORK EXPERIENCE',h:'NearLearn Pvt. Ltd.',b:'<p>Bengaluru</p><ul><li>SEO and marketing</li><li>Graphic design &amp; social media management</li><li>Content creation</li><li>Keyword research and content optimization</li><li>Promotional materials for technical training courses</li></ul>'},
{id:'College Zone',p:[-16,24,-12],t:[-48,14,-48],k:'EDUCATION &amp; INTERNSHIP',h:'Surana College Autonomous',b:'<p>Bengaluru • <b>B.Com</b></p><p>Six-month internship in graphic design and social media: created promotional and visual content and supported social media activities.</p>'},
{id:'Creative Studio',p:[6,5,62],t:[0,7,15],k:'CREATIVE STUDIO',h:'Selected work',b:'<ul><li>NearLearn course promotional designs</li><li>Machine Learning &amp; Generative AI marketing materials</li><li>Tableau &amp; Cybersecurity creatives</li><li>SEO blog content and website optimization</li><li>Social media strategies and campaigns</li><li>College event posters, banners, brochures</li><li>Digital marketing reports and content proposals</li></ul>'},
{id:'My Journey',follow:1,k:'THE DRIVE',h:'My journey',b:'<p>🎓 <b>College</b> — Surana College, B.Com</p><p>🎨 <b>Internship</b> — Graphic design &amp; social media</p><p>📈 <b>NearLearn</b> — SEO &amp; Marketing</p><p>🚀 <b>Future</b> — New horizons</p><p><em>Goal: build effective campaigns, strengthen brand visibility and contribute to business growth.</em></p>'},
{id:'Rooftop & Contact',p:[-62,31.6,68],t:[-20,28,40],k:'ROOFTOP • CONTACT',h:'Let’s connect',b:'<p>Bengaluru, Karnataka, India</p><p><a href="mailto:yr90819@gmail.com">yr90819@gmail.com</a></p><p><a href="https://linkedin.com/in/yuvaraj-k-0192593aa" target="_blank">LinkedIn</a> • <a href="https://instagram.com/mr._yuva_" target="_blank">Instagram</a></p>',sig:1}
];
const nav=document.getElementById('nav'),panel=document.getElementById('panel'),sig=document.getElementById('sig');
stops.slice(1).forEach((s,i)=>{const b=document.createElement('button');b.textContent=s.id.toUpperCase();b.onclick=()=>{auto=false;auB();go(i+1)};nav.appendChild(b);});
const autoBtn=document.getElementById('auto');function auB(){autoBtn.textContent=auto?'❚❚ AUTO CAMERA':'▶ AUTO CAMERA'}
let cur=0,from={p:new T.Vector3(-80,60,120),t:new T.Vector3(0,30,-60)},to=null,t0=0,dur=6,arrived=true,auto=false,started=false,arrAt=0;
const cp=cam.position.clone().set(-90,48,125),ct2=new T.Vector3(0,30,-60);
function tgt(s){if(s.follow)return{p:new T.Vector3(car.position.x+3,3.2,car.position.z+11),t:car.position.clone().add(new T.Vector3(0,1,-8))};return{p:P(s.p),t:P(s.t)};}
function go(i){cur=(i+stops.length)%stops.length;if(cur===0&&started)cur=1;const s=stops[cur];from={p:cp.clone(),t:ct2.clone()};t0=clock.elapsedTime;dur=cur===0?4:6.5;arrived=false;panel.classList.remove('on');sig.style.opacity=0;
 [...nav.children].forEach((b,j)=>b.classList.toggle('on',j+1===cur));}
function show(){const s=stops[cur];if(!s.h)return;panel.innerHTML='<small>'+s.k+'</small><h2>'+s.h+'</h2>'+s.b;panel.classList.add('on');sig.style.opacity=s.sig?1:0;}
document.getElementById('enter').onclick=()=>{started=true;document.getElementById('title').style.opacity=0;document.getElementById('title').style.pointerEvents='none';nav.style.opacity=1;document.getElementById('bar').style.opacity=1;auto=true;auB();go(1);};
document.getElementById('next').onclick=()=>{auto=false;auB();go(cur+1)};document.getElementById('prev').onclick=()=>{auto=false;auB();go(cur-1<1?stops.length-1:cur-1)};
autoBtn.onclick=()=>{auto=!auto;auB();arrAt=clock.elapsedTime};
const clock=new T.Clock(),ease=u=>u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2,v1=new T.Vector3(),v2=new T.Vector3();
// initial camera
cam.position.copy(cp);
function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05),et=clock.elapsedTime;
 carZ+=dt*16;if(carZ>120)carZ=-120;car.position.set(12+(2.2),0,carZ);
 traffic.forEach(o=>{o.s+=dt*o.v*o.dir;if(Math.abs(o.s)>160)o.s=-160*o.dir;if(o.ax){o.m.position.set(o.s,.7,o.lane);o.m.rotation.y=Math.PI/2}else{o.m.position.set(o.lane,.7,o.s);o.m.rotation.y=0}});
 const s=stops[cur],g2=tgt(s);let u=Math.min((et-t0)/dur,1);
 if(!arrived){const e=ease(u);v1.lerpVectors(from.p,g2.p,e);v1.y+=Math.sin(Math.PI*e)*8;v2.lerpVectors(from.t,g2.t,e);cp.copy(v1);ct2.copy(v2);if(u>=1){arrived=true;arrAt=et;show();}}
 else{cp.copy(g2.p);ct2.copy(g2.t);if(auto&&started&&et-arrAt>(s.follow?11:9))go(cur+1);}
 const sw=arrived?1:0.4;cam.position.set(cp.x+Math.sin(et*.35)*1.2*sw,cp.y+Math.cos(et*.5)*.5*sw,cp.z+Math.cos(et*.3)*1.2*sw);cam.lookAt(ct2);
 ren.render(scene,cam);}
// idle intro drift
const t00=0;loop();
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)});
</script></body></html>
